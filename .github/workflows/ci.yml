name: CI
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: liberica
          cache: maven
      - name: Build and test Jar
        run: ./mvnw --batch-mode verify
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish OCI image
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          ./mvnw --batch-mode spring-boot:build-image \
            -DskipTests \
            -Dimage.publish=true \
            -Dimage.name=docker.io/anonymouz/jgc:latest \
            -Dimage.additional-names=docker.io/anonymouz/jgc:${SHORT_SHA}
